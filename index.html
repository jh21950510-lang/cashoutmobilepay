<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>모바일페이 24시간 간편 상담센터</title>
  <meta name="description" content="빠르고 안전한 모바일 소액 결제/비상금 맞춤 간편 상담 서비스" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-24">

  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-slate-200 px-4 py-3">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="bg-blue-600 text-white font-black text-lg px-2 py-0.5 rounded">PAY</span>
        <span class="font-extrabold text-lg text-slate-900 tracking-tight">모바일24</span>
      </div>
      <a href="tel:1588-0000" class="inline-flex items-center space-x-1 text-sm font-bold text-blue-600 bg-blue-50 px-3 py-1.5 rounded-full border border-blue-200">
        <i class="fa-solid fa-phone"></i>
        <span>전화상담</span>
      </a>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-6 space-y-8">
    <section class="bg-gradient-to-br from-blue-900 via-indigo-900 to-slate-900 rounded-2xl p-6 text-white shadow-xl">
      <div class="inline-block bg-blue-500/30 text-blue-300 text-xs font-semibold px-2.5 py-1 rounded-full border border-blue-400/30 mb-3">
        ⚡ 365일 24시간 실시간 접수
      </div>
      <h1 class="text-2xl font-extrabold leading-snug mb-2">
        복잡한 절차 없이<br />
        <span class="text-amber-400">5분 내 빠른 맞춤 상담</span>
      </h1>
      <p class="text-slate-300 text-xs mb-6">
        신용조회 기록 없이 1:1 비공개 안심 무료 상담을 제공합니다.
      </p>

      <form id="consultForm" class="bg-white rounded-xl p-4 text-slate-800 space-y-3 shadow-inner">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">성함 / 닉네임</label>
          <input type="text" id="userName" required placeholder="홍길동" class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" />
        </div>
        
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">연락처</label>
          <input type="tel" id="userPhone" required placeholder="010-1234-5678" class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">상담 희망 분야</label>
          <select id="userCategory" class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <option value="소액결제 상담">모바일 소액결제 상담</option>
            <option value="비상금 상품 상담">비상금 맞춤 상품 안내</option>
            <option value="카드/포인트 상담">카드 및 포인트 한도 상담</option>
            <option value="기타 문의">기타 상담</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">희망 금액대</label>
          <select id="userAmount" class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <option value="10~30만원">10만 원 ~ 30만 원</option>
            <option value="30~50만원">30만 원 ~ 50만 원</option>
            <option value="50~100만원">50만 원 ~ 100만 원</option>
            <option value="100만원 이상">100만 원 이상</option>
          </select>
        </div>

        <div class="flex items-start space-x-2 pt-1">
          <input type="checkbox" id="privacyAgree" required class="mt-0.5 rounded text-blue-600 focus:ring-blue-500" />
          <label for="privacyAgree" class="text-xs text-slate-500 leading-tight">
            개인정보 수집 및 상담 안내 연락에 동의합니다. (필수)
          </label>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg text-sm transition shadow-md flex items-center justify-center space-x-2">
          <span>무료 간편 상담 신청하기</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </form>
    </section>

    <footer class="bg-slate-200/70 rounded-xl p-4 text-[11px] text-slate-600 space-y-2">
      <p class="font-bold text-slate-700">사업자 정보 및 이용안내</p>
      <div class="leading-relaxed">
        상호명: 모바일24 | 대표자: OOO<br />
        사업자등록번호: 000-00-00000 | 통신판매업신고: 제2026-서울-0000호<br />
        고객센터: 1588-0000 | 이메일: contact@cashoutmobilepay.co.kr
      </div>
      <p class="text-slate-500 pt-2 border-t border-slate-300">
        © 2026 모바일24. All rights reserved.
      </p>
    </footer>
  </main>

  <aside class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur border-t border-slate-200 p-3 z-50">
    <div class="max-w-md mx-auto grid grid-cols-2 gap-2">
      <a href="tel:1588-0000" class="bg-slate-800 text-white font-bold py-2.5 rounded-lg flex items-center justify-center space-x-2 text-sm shadow">
        <i class="fa-solid fa-phone"></i>
        <span>전화 바로연결</span>
      </a>
      <a href="https://pf.kakao.com/" target="_blank" rel="noopener noreferrer" class="bg-yellow-400 text-slate-900 font-bold py-2.5 rounded-lg flex items-center justify-center space-x-2 text-sm shadow">
        <i class="fa-solid fa-comment"></i>
        <span>카카오톡 상담</span>
      </a>
    </div>
  </aside>

  <script>
    document.getElementById('consultForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = '신청 처리 중...';

      const token = '8608422205:AAEXzq_wxl_WwEtDQK_eCxr289dPd7mdaNI';
      const chatId = '7311651628';

      const name = document.getElementById('userName').value;
      const phone = document.getElementById('userPhone').value;
      const category = document.getElementById('userCategory').value;
      const amount = document.getElementById('userAmount').value;

      const message = `🚨 [신규 상담 신청 접수]\n\n• 성함: ${name}\n• 연락처: ${phone}\n• 분야: ${category}\n• 금액: ${amount}`;

      const url = `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`;

      fetch(url)
        .then(res => res.json())
        .then(data => {
          if (data.ok) {
            alert(`[상담 신청 완료]\n${name}님, 정상 접수되었습니다.`);
            document.getElementById('consultForm').reset();
          } else {
            alert('오류 메시지: ' + data.description);
          }
        })
        .catch(err => {
          alert('네트워크 전송 오류가 발생했습니다.');
        })
        .finally(() => {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>무료 간편 상담 신청하기</span><i class="fa-solid fa-arrow-right text-xs"></i>';
        });
    });
  </script>
</body>
</html>
